# 注册本 Experiment 的受控 Preset。
- id: agent-preset-registry
  config:
    default: asset-discovery-assistant

- insert:
    - id: preset-asset-discovery-assistant
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: asset-discovery-assistant
        plugins:
          - id: asset-discovery-assistant-harness
            name: cordis:include
            config:
              path: /opt/dsh-presets/asset-discovery-assistant/agent.cordis.yml
