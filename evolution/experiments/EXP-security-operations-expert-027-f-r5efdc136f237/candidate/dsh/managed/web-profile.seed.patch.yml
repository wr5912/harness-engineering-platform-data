# 新实例的初始连接；地址、鉴权及资源范围在 MCP 配置管理中保存。
- insert:
  - id: mcp-session-manager
    name: file:///opt/dsh-managed/mcp-manager/index.mjs
    config:
      servers:
      - id: policy-response
        serverName: policy-response
        description: 策略与应急原始 AISOC 工具和资源
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/policy-response/v2
        headers: []
        tools:
          mode: all
          names: []
      - id: policy-response-acceptance
        serverName: policy-response-acceptance
        description: 策略与应急未发布组合专用验收入口，待平台绑定
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/policy-response-acceptance/v2
        headers: []
        tools:
          mode: selected
          names:
          - policy_change
          - emergency_action
      - id: ai-soc-correlate
        serverName: ai-soc-correlate
        description: SOC 关联/研判读取（应急处置资源）
        enabled: true
        specUrl: http://172.16.138.223:18085/v3/api-docs/mcp
        apiKey: ''
        authType: credential
        authHeader: X-API-Key
        headers: []
        tools:
          mode: all
          names: []
      - id: sec-ops
        serverName: sec-ops
        description: ''
        enabled: true
        url: http://172.16.138.232:50500/mcp/security-operations-expert
        headers: []
        tools:
          mode: selected
          names:
          - search_graph_assets
          - get_graph_resolve_ip_host
          - get_soc_asset_by_asset_id
          - list_soc_asset
          - get_soc_asset_biz_systems
          - get_soc_asset_vulnerabilities
          - get_ingest_devices_by_asset_by_asset_id
          - get_graph_node_detail
          - get_graph_path_query
          - get_reachability_path_by_ip
          - get_graph_flow_host_pair_ports
          - get_reachability_cross_signal
          - get_graph_compliance_violations
          - get_graph_coverage
          - get_event_by_id
      - id: inspection
        serverName: inspection
        description: ''
        enabled: true
        url: http://172.16.138.228:26000/mcp/inspection
        headers: []
        tools:
          mode: all
          names: []
      - id: troubleshooting
        serverName: troubleshooting
        description: 已发布故障排查目录、诊断运行与同次报告
        enabled: true
        url: http://172.16.138.228:26000/mcp/troubleshooting
        headers: []
        tools:
          mode: selected
          names:
          - list_troubleshooting_playbooks
          - start_diagnosis
          - get_diagnosis_result
      - id: report-write
        serverName: report-write
        description: 仅受信研判运行时保存并回读同次报告，不向模型授权写入
        enabled: true
        url: http://172.16.138.228:26000/mcp/persistence
        headers: []
        tools:
          mode: selected
          names:
          - save_persistence_result
          - get_persistence_result
      - id: threat-analysis-runtime
        serverName: threat-analysis-runtime
        description: 平台工具与资源分组 v2；服务就绪后在 MCP 管理页发现并启用。
        enabled: false
        url: http://10.0.160.32:18120/hep/mcp/groups/threat-analysis-runtime/v2
        headers: []
        tools:
          mode: selected
          names: []
      groups:
      - id: inspection-readonly
        members:
        - serverId: inspection
          names:
          - list_executable_inspections
          - get_inspection_result
      sharedToken: ''
