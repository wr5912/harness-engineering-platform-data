# 注册本 Experiment 的受控 Preset。
- id: agent-preset-registry
  config:
    default: ai-proposal-document-generator

- insert:
    - id: preset-ai-proposal-document-generator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: ai-proposal-document-generator
        plugins:
          - id: ai-proposal-document-generator-harness
            name: cordis:include
            config:
              path: /opt/dsh-presets/ai-proposal-document-generator/agent.cordis.yml

# 复用 MIT 许可的 dsh-ui-html，在对话中渲染沙箱化方案工作台。
- insert:
    - id: ui-html
      name: /opt/dsh-managed/dsh-ui-html/lib/index.js
      config:
        enabled: true
        announceToAgent: true
        maxHtmlBytes: 262144
        maxEventBytes: 65536
        interactionTimeoutMs: 0
        allowedResourceOrigins: []
        eventBridgeEnabled: true

# 在 DSH 原生 Web 壳内显示完整方案工作台，不使用 iframe。
- insert:
    - id: proposal-workbench-ui
      name: /opt/dsh-managed/ai-proposal-workbench/lib/index.js
      config:
        enabled: true
