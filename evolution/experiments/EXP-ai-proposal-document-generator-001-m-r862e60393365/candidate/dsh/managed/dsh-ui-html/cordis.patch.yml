# dsh-ui-html bundle patch — applied when a profile lists this bundle.
#
# One row carries both halves:
#   * the node half (exports ".") registers the `show_ui` tool and the
#     package-private HTTP event bridge in the host process;
#   * the `dsh.client` declaration in package.json makes the browser half
#     (exports "./client") load in the Web GUI and register the keyed
#     `tool.call.toolview` view for the `show_ui` wire tool name.
- insert:
    - id: ui-html
      name: '@eaglezlee/dsh-ui-html'
      config:
        # 总开关：关闭后不注册工具、不注册事件桥、不发系统提示。
        enabled: true
        # 是否向 agent 的系统提示声明本插件（关闭后仅在用户点名时使用）。
        announceToAgent: true
        # 单次界面 HTML 的最大字节数（UTF-8）。
        maxHtmlBytes: 262144
        # 单条交互事件 payload 序列化后的最大字节数。
        maxEventBytes: 65536
        # 等待用户交互的超时（毫秒）；0 = 一直等到本轮被取消（与 ask_user_question 一致）。
        interactionTimeoutMs: 0
        # 允许界面加载的外部资源来源（scheme://host[:port]），默认全部禁止。
        allowedResourceOrigins: []
        # 交互事件回传开关：关闭后 wait_for_interaction=true 返回
        # status="unsupported"（界面仅展示，不抛错）。
        eventBridgeEnabled: true
