# 新实例的初始连接；地址、鉴权及资源范围在 MCP 配置管理中保存。
- insert:
  - id: mcp-session-manager
    name: file:///opt/dsh-managed/mcp-manager/index.mjs
    config:
      servers:
      - id: policy-configuration
        serverName: policy-configuration
        description: 单来源统一策略分组 v2；单点与部门共用HEP业务签名网关
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/policy-configuration/v2
        headers: []
        tools:
          mode: all
          names: []
      - id: emergency-action
        serverName: emergency-action
        description: 平台应急处置分组 v2；经统一网关业务签名通道访问
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/emergency-action/v2
        headers: []
        tools:
          mode: all
          names: []
      - id: ai-soc-correlate
        serverName: ai-soc-correlate
        description: SOC 关联/研判读取（应急处置资源）
        enabled: true
        specUrl: http://172.16.138.223:18085/v3/api-docs/mcp
        apiKey: ''
        authType: credential
        authHeader: X-API-Key
        headers: []
        tools:
          mode: all
          names: []
      - id: sec-ops
        serverName: sec-ops
        description: ''
        enabled: true
        url: http://172.16.138.232:50500/mcp/security-operations-expert
        headers: []
        tools:
          mode: selected
          names:
          - search_graph_assets
          - get_graph_resolve_ip_host
          - get_soc_asset_by_asset_id
          - list_soc_asset
          - get_soc_asset_biz_systems
          - get_soc_asset_vulnerabilities
          - get_ingest_devices_by_asset_by_asset_id
          - get_graph_node_detail
          - get_graph_path_query
          - get_reachability_path_by_ip
          - get_graph_flow_host_pair_ports
          - get_reachability_cross_signal
          - get_graph_compliance_violations
          - get_graph_coverage
          - get_event_by_id
      - id: soc-readonly
        serverName: soc-readonly
        description: 主助手直接查询已有SOC事实
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/soc-readonly/v2
        headers: []
        tools:
          mode: selected
          names:
          - search_graph_assets
          - get_graph_resolve_ip_host
          - get_soc_asset_by_asset_id
          - list_soc_asset
          - get_soc_asset_vulnerabilities
          - get_admin_baseline_report_latest
          - get_graph_path_query
      - id: inspection-compositions
        serverName: inspection-compositions
        description: ''
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/inspection-compositions/v2
        headers: []
        tools:
          mode: all
          names: []
      - id: troubleshooting-compositions
        serverName: troubleshooting-compositions
        description: 只读业务访问与设备不在线排查及同次运行报告
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/troubleshooting-compositions/v2
        headers: []
        tools:
          mode: selected
          names:
          - diagnose_business_access
          - diagnose_device_offline
          - get_composition_run
          - get_composition_artifact
          - get_composition_details
      - id: report-write
        serverName: report-write
        description: 仅受信研判运行时保存并回读同次报告，不向模型授权写入
        enabled: true
        url: http://172.16.138.228:26000/mcp/persistence
        headers: []
        tools:
          mode: selected
          names:
          - save_persistence_result
          - get_persistence_result
      - id: threat-analysis-runtime
        serverName: threat-analysis-runtime
        description: 平台工具与资源分组 v2；服务就绪后在 MCP 管理页发现并启用。
        enabled: false
        url: http://10.0.160.32:18120/hep/mcp/groups/threat-analysis-runtime/v2
        headers: []
        tools:
          mode: selected
          names: []
      # 策略已由远端同名HEP组完成12工具/5模板选择；本地不再次过滤或包装其资源URI。
      # 模型确认/决定的永久禁用仍由业务守卫执行；不通过目录声明授予执行权限。
      groups:
      - id: emergency-action
        members:
        - serverId: emergency-action
          names:
          - preview_disposition
          - prepare_emergency_action
          - revise_emergency_action
          - cancel_emergency_action
          - get_emergency_action
          - get_emergency_action_result
          - list_emergency_actions
          resourceUris: []
          resourceTemplates: []
        - serverId: ai-soc-correlate
          names: []
          resourceUris: []
          resourceTemplates:
          - http://172.16.138.223:18085/correlate/incident/{incidentId}
          - http://172.16.138.223:18085/correlate/incident/{incidentId}/judgements
          - http://172.16.138.223:18085/correlate/incident/judgement/{judgementId}/report
          - http://172.16.138.223:18085/correlate/reasoning/rules/{ruleId}
      # 仅供主助手既有asset_onboarding内部引用；连接/凭据由业务管理包装解析，不新增底层客户端。
      - id: asset-management
        members:
        - serverId: ai-soc-master
          names:
          - create_soc_asset_probe
          - create_soc_discovery_identify
          - create_soc_discovery_tasks
          - start_soc_discovery_tasks
          - create_soc_discovery_tasks_adopt
          - create_soc_asset
          resourceUris: []
          resourceTemplates:
          - http://172.16.138.223:18087/soc/discovery/tasks/{taskId}
      sharedToken: ''
