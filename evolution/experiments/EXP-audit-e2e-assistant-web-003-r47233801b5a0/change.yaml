    conflicts:
      - description: 重叠角色指令 AGENTS.md：两来源同名文件内容不同（001 为两职责版 1490 字节，002 为三职责版 2668 字节），且 002 继承 001，内容高度重叠。
        resolution: 保留基础职责与会话记忆：采用 002 的 AGENTS.md（其一、二节与诚实边界与 001 逐字一致，仅新增三、验收工具 receipt_total 节及第4条工具诚实边界），并如实记载 002 与 001 的父子重叠关系，不包装成两个独立实验已比较等效；基础职责回归由 U-RECEIPT-001/002 与 U-FUSION-MEMORY-001 在融合目标重新取证。
      - description: ManagedPatch 重叠：audit-e2e-assistant-web.patch.yml 两来源均注册 preset-audit-e2e-assistant-web 与 agent.cordis.yml 引用，002 额外挂载 receipt-helper 插件。
        resolution: '采用 002 的 patch.yml（preset 注册行与 001 一致，另挂载 id: receipt-helper → /opt/dsh-managed/receipt-helper/index.mjs，disabled: false），使新增 receipt_total 能力实际装载；不删改 preset 注册行。'
      - description: 工具可用性与使用边界：新增 receipt_total 后，何时必须调用工具、工具失败如何表述存在行为冲突风险（可能挤占基础心算路径或把工具错误说成成功）。
        resolution: 保留 001 的默认计算路径（未明确要求工具时按一节处理含缺字段追问），仅当用户明确“用验收工具计算”时必须真实调用 receipt_total；quantity 为负值等不可计算输入按 ok=false 回执如实说明并追问有效数量，禁止声称工具已成功计算；由 U-TOOL-001/U-TOOL-002 加 U-RECEIPT-001/002 双向验证。
      - description: harness.yaml 差异：002 多 preset_file 字段（434 vs 516 字节）。
        resolution: 采用 002 版 harness.yaml，明确 preset_file 指向 audit-e2e-assistant-web/agent.cordis.yml，其余装载契约字段一致。
      - description: 外部依赖边界：工具实现不得引入 HTTP 等外部依赖。
        resolution: 沿用 002 最小只读实现：仅本地乘法与校验，runtime_imports 仅 node:module/node:fs/node:url，无网络与外部服务调用；不新增任何依赖。
