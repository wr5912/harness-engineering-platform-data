features:
  - id: FUS-F-01
    title: 基础收据合计计算
    description: 仅根据用户给定单价与数量计算合计（乘积）并说明单位，如“单价 17.5 元/件 × 数量 4 件 = 合计 70 元”；不扩展其他业务。来源：001（git:02107ea…）AGENTS.md 一节，002 同文保留。验证：U-RECEIPT-001。
    source_refs: []
    evidence_refs: []
  - id: FUS-F-02
    title: 缺字段追问不猜测
    description: 单价或数量缺任一项时追问缺少的那一项，不猜测、不估算、不代填，信息不全不给合计。来源：001 AGENTS.md 一节2，002 同文保留。验证：U-RECEIPT-002。
    source_refs: []
    evidence_refs: []
  - id: FUS-F-03
    title: 同会话收据编号记忆
    description: “记录收据编号X”在当前会话记住 X，查询时原样返回，不改写不补全；仅限当前会话，不声称写入数据库或持久化保存。来源：001 AGENTS.md 二节，002 同文保留。验证：U-FUSION-MEMORY-001（两轮、同 Session，第二轮原样返回 E2E-FUSION-6428）。
    source_refs: []
    evidence_refs: []
  - id: FUS-F-04
    title: receipt_total 只读计算工具实际装载与真实调用
    description: 新增只读工具 receipt_total（unit_price/quantity 入参，本地乘法，不访问外部系统、不保存业务数据）经 ManagedPatch 挂载 /opt/dsh-managed/receipt-helper/index.mjs 实际进入工具目录；用户明确要求“用验收工具计算”时必须真实调用并依据回执回答，不得心算冒充或声称调用而未调用。来源：002 增量（receipt-helper/index.ts、index.mjs、patch.yml、AGENTS.md 三节）。验证：U-TOOL-001（含真实 tool/call 与 tool/result 回执核对）。
    source_refs: []
    evidence_refs: []
  - id: FUS-F-05
    title: 工具不可计算如实报告并追问
    description: 单价或数量不是有限非负数（如 quantity=-1）时工具返回 ok=false 与明确原因，助手如实说明无法计算、要求提供有效数值；不输出猜测合计或负合计，不把工具错误说成成功。来源：002 增量。验证：U-TOOL-002。
    source_refs: []
    evidence_refs: []
  - id: FUS-F-06
    title: 融合装载契约与受控构建产物
    description: 'harness.yaml 采用 002 版（含 preset_file: audit-e2e-assistant-web/agent.cordis.yml，load_mode container-only，managed_root dsh/managed）；ManagedPatch 同时注册 preset（/opt/dsh-presets/audit-e2e-assistant-web/agent.cordis.yml）与 receipt-helper 插件；Preset persona 前缀引用工作区 AGENTS.md（与 001/002 同一 blob）。receipt-helper 经受控 assets/build 产出 index.mjs（TS 5.9.3/esbuild 0.25.12），runtime_imports 仅 node:module/node:fs/node:url，不引入任何 HTTP 外部依赖，不执行来源 package scripts。属配置与构建声明，实际装载待 load 检查取证。'
    source_refs: []
    evidence_refs: []
