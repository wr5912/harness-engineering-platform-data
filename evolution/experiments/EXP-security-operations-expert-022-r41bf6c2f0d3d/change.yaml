  - id: "four-stage-pipeline-and-delivery"
    title: "取证→研判→回写→报告四阶段交付（同一运行身份）"
    description: "collect、infer、writeback、report 四阶段在同一 run_id 与同一运行身份内完成，真实调用 deepseek-official/deepseek-flash（reasoningEffort=max）；SOC 摘要与报告落盘（saved）并提供报告下载。阶段 completed 只代表流程节点结束，不代表输出校验通过；交付合同允许保留失败结果并要求人工复核，快判、接口连通或固定报告 HTML 都不能代替内层模型校验。"
