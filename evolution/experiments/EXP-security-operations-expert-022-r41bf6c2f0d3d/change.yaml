    change: "相对固定父版只改写 dsh/managed/threat-analysis/prompts/threat-analysis-system.txt（8339 → 10852 字节）：在既有输出合同上新增生成前实体映射步骤与输出前自检，把事实与分类标签分开表达；harness.yaml 同尺寸改动仅登记新身份。两次真实模型调用（native-mcp-stages 与 native-mcp-composite）均 passed、warnings=[]。"
  - id: "entity-readable-and-evidence-fidelity"
    title: "实体可读标识、事实边界与证据类型保真"
    description: "面向读者的 fact、claim、description、reason、target、summary 只使用 entity_display、IP、主机名、用户或资产 ID，不出现裸 E 编号，无法确定可读标识时说明缺口而不猜映射；规则 ID、名称、描述和事件声明不得作为 verified_facts，事件类型等分类标签只能以真实 field/value 在 key_claims evidence 中引用；evidence.field 必须是所属五源对象内真实存在的相对路径，evidence.value 逐值复制对应路径的非空原值并保持 JSON 类型（数字、布尔不加引号，对象和数组不改写为文本），null 与空数组不作为支持或反向证据。"
    source_refs:
      - "evolution/experiments/EXP-security-operations-expert-022-r41bf6c2f0d3d/candidate/dsh/managed/threat-analysis/prompts/threat-analysis-system.txt"
    evidence_refs:
