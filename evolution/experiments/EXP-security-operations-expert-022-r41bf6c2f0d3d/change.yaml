    title: "五源威胁研判输出合同（本版核心变更）"
    description: "模型只依据输入的单个事件数据输出固定字段 JSON，不调用工具、不输出 Markdown 或解释文字；primary_claim.type 逐值复制 judgement_target.claim_type；verdict、primary_claim.result、confidence_score、secondary_findings 与攻击阶段字段相互约束；verified_facts 最多 8 条且只能概括 graph/edr_detail/asset/threat_intel/history 的实际非空观察；输出前在内部逐项自检并修正当前 JSON，不输出检查过程。"
    source_refs:
      - "evolution/experiments/EXP-security-operations-expert-022-r41bf6c2f0d3d/candidate/dsh/managed/threat-analysis/prompts/threat-analysis-system.txt"
