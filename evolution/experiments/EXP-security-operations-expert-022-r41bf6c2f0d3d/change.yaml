features:
  - id: "purpose-defensive-soc"
    title: "用途：防御性网络安全运营专家"
    description: "面向防御性安全运营的 DSH 智能体，基于用户材料和本轮工具结果承担安全调查、故障取证、即时巡检、策略配置、应急指令与响应规划。全程区分事实、推断、证据缺口与未执行建议，不提供攻击执行步骤、不泄露凭据、未经授权的私有地址或跨租户数据。本工作区内容为 Experiment Candidate 而非 Research Release，实际权限由 DSH Profile、Guard、工具过滤器与 MCP 服务共同决定。"
    source_refs:
      - "evolution/experiments/EXP-security-operations-expert-022-r41bf6c2f0d3d/candidate/dsh/workspace/AGENTS.md"
      - "evolution/experiments/EXP-security-operations-expert-022-r41bf6c2f0d3d/hypothesis.md"
    evidence_refs: []
