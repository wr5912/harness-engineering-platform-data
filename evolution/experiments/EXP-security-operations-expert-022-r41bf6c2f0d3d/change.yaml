  - id: "fast-classification-without-model"
    title: "名单快速分类由固定代码执行、不调用模型"
    description: "快判与五源研判是互斥输出分支：只有完整读取名单且已有直接实体单侧命中时才输出快速结果（顶层仅 verdict、matches，每项六个必填字段），双侧命中、均未命中或名单查询不完整进入五源研判；快速结果不包含 unified_event_id、confidence_score、primary_claim 等五源字段。正常运行时快速结果直接交付，不调用模型；完整事件则执行取证、研判、模拟回写、报告交付。"
    source_refs:
