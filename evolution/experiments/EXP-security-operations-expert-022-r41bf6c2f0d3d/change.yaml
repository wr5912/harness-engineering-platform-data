  - id: "inherited-capability-surface"
    title: "完整继承父版能力面（巡检、故障、策略、应急、语音、MCP 组桥接）"
    description: "与父版 EXP-security-operations-expert-021-rdd331f9f2e30 逐字节核对为 214 个文件、0 缺失、0 新增，仅系统提示词与版本身份登记变化，因此父版的 Preset、Guard、巡检、故障取证、策略应急、资源模板、受信 Schedule、语音延迟能力与原生 MCP 组桥接原样继承。本轮评测只覆盖基本模拟五源研判链路，这些继承能力的业务效果未重新评估，也不自动切换任何现有业务实例来源。"
