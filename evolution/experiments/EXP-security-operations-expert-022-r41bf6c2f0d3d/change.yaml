  - id: "routing-delegation-permissions"
    title: "单主路由、三个委派入口与工具权限矩阵"
    description: "每轮只选择一个主路由（明确单动作应急指令、明确新增网络访问策略、明确事件 ID 威胁研判、故障排查、即时巡检、受信响应规划、通用安全调查按序判定）；委派深度最多 1，唯一子 Agent 入口为 delegate_threat_analysis、delegate_fault_analysis、delegate_response_planning。策略草稿、应急草案、DSH Schedule 与巡检工具只允许主 Agent 调用，15 个 SOC 只读工具只允许故障子 Agent 调用；未列入 role-tool-matrix.yaml 的 MCP 工具一律拒绝，Bash、代码执行、网络搜索、通用委派与跨租户访问不可用。"
    source_refs:
      - "evolution/experiments/EXP-security-operations-expert-022-r41bf6c2f0d3d/candidate/dsh/workspace/AGENTS.md"
    evidence_refs: []
  - id: "trusted-confirmation-write-boundary"
    title: "策略配置与应急指令的受信确认、写入边界"
    description: "策略配置使用独立 mcp__policy-configuration__ 草稿工具，草稿就绪时原样展示 Workbench 的 data.result_markdown 全文与配置预览，模型不得自行生成命令；应急指令使用独立 mcp__emergency-action__ 工具核对 Workbench 冻结草案的动作与目标。用户单独发送“执行”或“确认执行”时，只有受信确认插件可绑定本会话最新 DRAFT 或有效草案并签名提交；模型不能调用确认、决策或旧策略工具与 SOC 写接口，排队、受理和 DRAFT 都不等于已生效。"
    source_refs:
      - "evolution/experiments/EXP-security-operations-expert-022-r41bf6c2f0d3d/candidate/dsh/workspace/AGENTS.md"
    evidence_refs: []
  - id: "scheduled-auto-threat-analysis"
    title: "受信 Schedule 桥驱动的自动威胁研判"
    description: "主 Agent 用 schedule_create 固定标题“自动威胁研判”、every_seconds 120 与固定 prompt 结构；只有本地受信桥解析该结构并固定调用 analyze_pending_threat_incidents，普通消息或提醒不构成授权。每次心跳只研判一条事件，上一条仍在运行时跳过本次心跳并显示当前事件 ID，认领冲突则跳过；删除或停止前必须先 schedule_list，DSH 无暂停工具时说明能力缺口；Schedule 投递成功不等于研判完成。"
    source_refs:
      - "evolution/experiments/EXP-security-operations-expert-022-r41bf6c2f0d3d/candidate/dsh/workspace/AGENTS.md"
    evidence_refs: []
  - id: "output-and-language-conventions"
    title: "输出格式、语言与未执行声明"
    description: "用户要求 JSON 时，最终回答从 { 开始、以 } 结束，是可直接解析的单个 JSON 对象，不加代码围栏；未指定格式时使用简洁 Markdown，默认中文、指定其他语言时遵从。仅依据用户材料作结构化输出时保留原始事实与单位，不添加输入中没有的时间等字段、不派生数值或风险等级；建议动作必须说明尚未执行。巡检回答依据服务返回的 conclusionStatus、businessSummary、reportMarkdown 与 reportDownloadUrl，运行中保留 runId 以便续查。"
    source_refs:
      - "evolution/experiments/EXP-security-operations-expert-022-r41bf6c2f0d3d/candidate/dsh/workspace/AGENTS.md"
    evidence_refs: []
