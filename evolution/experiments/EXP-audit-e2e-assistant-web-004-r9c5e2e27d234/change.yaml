    source_refs: []
    evidence_refs: []
  - id: "FUS-F-04"
    title: "receipt_total 只读计算工具实际装载与真实调用"
    description: "新增只读工具 receipt_total（unit_price/quantity 入参，本地乘法，不访问外部系统、不保存业务数据、无 HTTP 依赖）经 ManagedPatch 挂载 /opt/dsh-managed/receipt-helper/index.mjs 实际进入工具目录；用户明确要求“用验收工具计算”时必须真实调用并依据回执回答，不得心算冒充或声称调用而未调用。来源：002 增量（receipt-helper/index.ts、受控构建 index.mjs、patch.yml、AGENTS.md 三节）。验证：U-TOOL-001（含真实 tool/call 与 tool/result 回执核对）。"
    source_refs: []
    evidence_refs: []
  - id: "FUS-F-05"
    title: "工具不可计算如实报告并追问"
    description: "单价或数量不是有限非负数（如 quantity=-1）时工具真实返回 ok=false 与明确原因，助手如实说明无法计算、要求提供有效数值；不输出猜测合计或负合计，不把工具错误说成成功。来源：002 增量。验证：U-TOOL-002。"
    source_refs: []
    evidence_refs: []
  - id: "FUS-F-06"
    title: "融合装载契约与受控构建产物"
    description: "harness.yaml 采用 002 版（含 preset_file: audit-e2e-assistant-web/agent.cordis.yml，load_mode container-only，managed_root dsh/managed）；ManagedPatch 同时注册 preset（/opt/dsh-presets/audit-e2e-assistant-web/agent.cordis.yml）与 receipt-helper 插件；Preset persona 前缀引用工作区 AGENTS.md。receipt-helper 源码自 002 固定ref实际装入，并经受控 assets/build-preview/build 产出 index.mjs（TS 5.9.3/esbuild 0.25.12，不执行来源 package scripts）；plan 内 build 检查为 argv 形式 node --check 的真实 ESM 语法检查，不替代受控构建本身。runtime_imports 仅 node:module/node:fs/node:url，不引入任何 HTTP 外部依赖。实际装载待 load 检查取证。"
    source_refs: []
    evidence_refs: []
