# 叠加到 DSH 官方 web Profile。该文件只由容器内 DSH 加载。
# MCP 管理插件在 Preset 作用域注册工具；独立子 Preset 和业务 Guard 限定各角色范围。

- id: tool-bash
  disabled: true

- id: tool-pwsh
  disabled: true

- id: tool-jobs
  disabled: true

- id: tool-fs
  disabled: false

- id: tool-fs-search
  disabled: false
  config:
    sampleOverCapGlobResults: false

- id: skill-filesystem
  disabled: false
  config:
    providerName: security-operations-workspace
    includeDefaultRoots: false
    customSkillDirs:
      - /work/harness/workspace/.agents/skills
    watch: !!js process.env.DSH_HARNESS_MODE === 'authoring'
    watchFollowSymlinks: false

- id: tool-skill
  disabled: false

- id: tool-web
  disabled: true

- id: tool-subagent-control
  disabled: true

- id: tool-subagent-list-agents
  disabled: true

- id: tool-subagent
  disabled: true

- id: tool-subagent-fork
  disabled: true

- id: tool-workflow
  disabled: true

- id: agent-preset-registry
  config:
    default: security-operations-expert

- id: agent-default-model
  config:
    provider: local-qwen
    model: Qwen3.8-27B

- id: llm-pi-ai
  config:
    providers:
      local-qwen:
        displayName: Local Qwen
        apiKeyEnv: LOCAL_LLM_API_KEY
        api: openai-completions
        # 保留服务端既有的 xhigh 思考默认值；语音摘要请求单独传 off。
        reasoning: xhigh
        baseURL: !!js '`${process.env.LOCAL_LLM_BASE_URL}/v1`'
        models:
          - id: Qwen3.8-27B
            name: Qwen3.8-27B
            contextWindow: 262144
            reasoningEfforts:
              off: null
              xhigh: xhigh
            compat:
              thinkingFormat: qwen-chat-template
              maxTokensField: max_tokens

- insert:
    - id: preset-security-operations-expert
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: security-operations-expert
        plugins:
          - id: security-operations-harness
            name: cordis:include
            config:
              path: /opt/dsh-presets/security-operations-expert/agent.cordis.yml

    - id: preset-security-operations-fault-analysis
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: security-operations-fault-analysis
        plugins:
          - id: security-operations-fault-harness
            name: cordis:include
            config:
              path: /opt/dsh-presets/security-operations-fault-analysis/agent.cordis.yml

    - id: preset-security-operations-response-planning
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: security-operations-response-planning
        plugins:
          - id: security-operations-response-harness
            name: cordis:include
            config:
              path: /opt/dsh-presets/security-operations-response-planning/agent.cordis.yml

    - id: preset-security-operations-threat-analysis
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: security-operations-threat-analysis
        plugins:
          - id: security-operations-threat-harness
            name: cordis:include
            config:
              path: /opt/dsh-presets/security-operations-threat-analysis/agent.cordis.yml

    - id: security-operations-ui
      name: /opt/dsh-managed/security-operations-ui/index.js

    - id: voice-mode
      name: /opt/dsh-managed/dsh-voice-hub/lib/index.js
      config:
        allowLan: true
        asrStreamUrl: ws://172.16.138.233:8012/v1/asr/stream
        asrBatchUrl: http://172.16.138.233:8002/v1/audio/transcriptions
        ttsStreamUrl: http://172.16.138.233:8003/tts/stream/cancellable
        ttsCancelUrl: 'http://172.16.138.233:8003/tts/cancel/{generationId}'

    - id: security-operations-delegate-fault-analysis
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_fault_analysis
        enableRunInBackground: false
        backgroundMode: one-shot
        maxDepth: 1
        agentPreset: security-operations-fault-analysis

    - id: security-operations-delegate-response-planning
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_response_planning
        enableRunInBackground: false
        backgroundMode: one-shot
        maxDepth: 1
        agentPreset: security-operations-response-planning

    - id: threat-analysis
      name: /opt/dsh-managed/threat-analysis.mjs
      config:
        # 模型由当前 DSH 会话继承；不再配置独立内层模型、地址或密钥。
        connections:
          runtimeGroup:
            id: threat-analysis-runtime
            url: http://10.0.160.32:3090/hep/mcp/groups/threat-analysis-runtime/v2

    - id: security-operations-delegate-threat-analysis
      name: '@deepseek-ai/dsh-tool-subagent'
      config:
        provider: spawn
        toolName: delegate_threat_analysis
        enableRunInBackground: false
        backgroundMode: one-shot
        maxDepth: 1
        agentPreset: security-operations-threat-analysis
