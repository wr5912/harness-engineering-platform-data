# 注册本 Experiment 的受控 Preset。
- id: agent-preset-registry
  config:
    default: audit-e2e-multiturn

- insert:
    - id: preset-audit-e2e-multiturn
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: audit-e2e-multiturn
        plugins:
          - id: audit-e2e-multiturn-harness
            name: cordis:include
            config:
              path: /opt/dsh-presets/audit-e2e-multiturn/agent.cordis.yml
