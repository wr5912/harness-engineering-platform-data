# MCP 管理插件按当前绑定将工具注册在 Preset 作用域；主 Agent 沿用原生目录与权限。
# 业务 Guard 保留旧 SOC 专用确认保护；子 Agent 独立 Preset 继续按原职责限制。
- id: persona
  name: /opt/dsh/packages/preset/persona/lib/index.js
  disabled: false
  config:
    prefix: >-
      你是网络安全运营专家，帮助用户开展防御性安全运营。
      问候、身份介绍与能力咨询以业务职责作答；用户可见表达遵循工作区的“身份与边界”。
      区分事实、推断和未执行建议；Prompt 不授予权限，所有高风险能力以
      Runtime、MCP 服务端、审批和审计的强制结果为准。
      部门或组织集合网络策略先走部门专用路线，加载 policy-configuration Skill 并读取工作区
      .agents/skills/policy-configuration/references/department-policy.md，
      不套用旧单点“解析成功立即prepare”的推进规则，不逐台循环准备草稿。
      对明确完整的分组任务创建指令，先加载该Skill；若真实目录已有原生高层工具create_department_policy_task，优先以空对象参数调用，
      由受信Runtime从本轮真实用户指令取参并通过固定高层API查询部门、计划、保存和回读，不让模型补造规则或任务。
      走部门MCP分步路线时，以真实工具及资源目录核对原七项部门能力及本地任务准备/查询两项能力，九项operation不等于九个工具；
      不因辅助MCP目录缺项就跳过已装载的原生高层入口，但原生工具存在不等于后端已经连接，接口失败必须如实交代。
      未装载、来源不唯一或权限缺失时说明具体缺口，不以单点策略、旧选择回调、底层SOC或模型直接HTTP变通。
      仅查看、分析或不保存时不创建任务或草稿；真实完整访问意图已明确时可保存本地多策略任务，
      即使authority或SOC阻塞也逐项保留原因；本地任务不是SOC草稿，不证明规则可下发或策略已生效。
      用户明确要求SOC草稿且本会话真实计划的合格子集允许准备时，按专用三引用协议一次准备一份多明细草稿，
      保留未纳入原因，不因其他成员不可配连坐；两种准备均不接入旧单点确认或自动执行。
      请求已发无回执或结果未知时不换号重发，已知操作号仅查询原操作。
      草稿仅是已保存的绑定证据，不代表当前SOC状态刷新、任务预检、审批、执行或业务连通；
      部门分支不触发旧单点原生执行确认。其他单点策略和业务仍按各自Skill及Runtime权限办理。
    suffix: 你的工作目录是 {{cwd}}。

- id: agent-instructions
  name: /opt/dsh/packages/context/agent-instructions/lib/index.js
  disabled: false
  config:
    maxBytes: 65536

- id: security-operations-guard
  name: /opt/dsh-managed/security-operations-guard.mjs
  disabled: false

- id: policy-selection-runtime
  name: /opt/dsh-managed/policy-selection-runtime.mjs
  disabled: false

# 确认器共用 DSH 原生问题面，保留精确确认词兼容入口，不向模型授予确认工具。
- id: policy-confirmation-runtime
  name: /opt/dsh-managed/policy-confirmation-runtime.mjs
  disabled: false

- id: emergency-confirmation-runtime
  name: /opt/dsh-managed/emergency-confirmation-runtime.mjs
  disabled: false

# 策略与应急结果由原程序交付，不由模型改写权威字段。
- id: operation-result-delivery
  name: /opt/dsh-managed/operation-result-delivery.mjs
  disabled: false

# 此本地REST编排器仅适用于后端同宿主网络环境。
# 当前实例为private bridge，不能以容器127.0.0.1访问宿主26113；保持禁用，不发布虚假可达能力。
# 部门策略主路线沿经统一网关的高层MCP接入，后端装载后再核目录并完成真实验收。
- id: policy-department-task-runtime
  name: /opt/dsh-managed/policy-department-task-runtime.mjs
  disabled: true
  config:
    backendBaseUrl: http://127.0.0.1:26113

# 保留现有插件装载身份；巡检只包装目标四工具中的启动与同次结果。
- id: inspection-preparation-runtime
  name: /opt/dsh-managed/inspection-preparation-runtime.mjs
  disabled: false

# 排查启动与结果只由主会话受管包装器注入上下文；SOC只读子路线不变。
- id: security-operations-diagnosis-runtime
  name: /opt/dsh-managed/diagnosis-runtime.mjs
  disabled: false

# XX设备开发模拟只使用官方原生MCP桥和原生提问，不增加确认控制器或工具过滤。
- id: xx-device-control-mock-mcp
  name: /opt/dsh/packages/mcp/mcp-client/lib/index.js
  config:
    serverName: xx-device-mock
    transport: stdio
    command: node
    args:
      - /opt/dsh-managed/xx-device-control-mock.mjs
    cwd: /work/harness/workspace
    failOnStartupError: true

# 策略模板是独立的一读一写工具系列；共用原生提问，不改守卫名单。
- id: xx-device-policy-mock-mcp
  name: /opt/dsh/packages/mcp/mcp-client/lib/index.js
  config:
    serverName: xx-policy-mock
    transport: stdio
    command: node
    args:
      - /opt/dsh-managed/xx-device-policy-mock.mjs
    cwd: /work/harness/workspace
    failOnStartupError: true

- id: tool-ask-user
  name: /opt/dsh/packages/interaction/tool-ask-user/lib/index.js
