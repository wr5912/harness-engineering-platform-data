  - "POLICY_CONFIGURATION_MCP_URL"
  - "AI_PLATFORM_URL"
  - "PLATFORM_CONFIRMATION_ISSUER"
  - "EMERGENCY_WORKBENCH_URL"
  - "EMERGENCY_WORKBENCH_TOKEN"
  - "EMERGENCY_CONFIRMATION_PRIVATE_KEY_B64"
  - "EMERGENCY_CONFIRMATION_ACTOR_ID"
  - "AI_WORKBENCH_EMERGENCY_TENANT_ID"
  - "AI_WORKBENCH_EMERGENCY_WORKSPACE_ID"
