schema_version: "1.0"
runtime: dsh-container-only
status: experiment-candidate
controls:
  - id: CTRL-DSH-001
    boundary: container-only-load
    enforcement: runtime-adapter
    failure_mode: stop
  - id: CTRL-DSH-002
    boundary: candidate-authoring-write-scope
    enforcement: bind-mount-plus-native-guard
    allowed: /work/harness/workspace
    denied:
      - /opt/dsh-managed
      - /opt/dsh-presets
      - /var/lib/dsh
      - repository-root
    authoring_live_behavior: experiment-only
    verification_activation: host-review-new-container-new-session
  - id: CTRL-DSH-003
    boundary: subject-read-only
    enforcement: bind-mount-plus-native-guard
    failure_mode: stop
  - id: CTRL-DSH-004
    boundary: role-tool-monotonic-decay
    enforcement: dsh-tool-filter-plus-native-guard
    maximum_delegation_depth: 1
  - id: CTRL-DSH-005
    boundary: mcp-service-authority
    enforcement: external-service
    required_checks:
      - authentication
      - tenant
      - object
      - parameter
      - quantity
      - audit
    repository_cannot_prove: true
  - id: CTRL-DSH-006
    boundary: response-planning
    enforcement: default-deny-native-guard
    trusted_gate_env: DSH_SEC_OPS_RESPONSE_PLANNING_ENABLED
    input_digest_env: DSH_SEC_OPS_RESPONSE_INPUT_SHA256
    output_schema_validation: native-post-execute-guard
    tool_access: none
  - id: CTRL-DSH-007
    boundary: native-bound-mcp-tools-and-role-separation
    enforcement: native-registration-and-native-permissions-plus-existing-role-guard
    unregistered_mcp: deny
    root_mcp_catalog: actual-bound-tools
    child_roles: role-tool-matrix.yaml
  - id: CTRL-DSH-008
    boundary: skill-and-composition-responsibility
    enforcement: skill-intent-and-stop-plus-native-composition-fixed-chain
    business_state: upstream-only
    local_platform_controller: absent
  - id: CTRL-DSH-009
    boundary: xx-native-user-interaction
    enforcement: official-dsh-ask-user
    ordinary_chat_is_structured_answer: false
    custom_confirmation_controller: absent
    server_authorization: upstream-responsibility
