    change: "新增"
  - id: "report-delivery"
    title: "完整读取后生成 Markdown/CSV 与实际下载入口"
    description: "report 先校验全部资产已进入已读集合，缺项时报“尚未读取全部设备，不能交付完整报告”并列出缺失 ID；通过后生成逐设备 Markdown 报告与 devices.csv，写入 report.md/devices.csv，回执含 device_count、device_ids、report_sha256、download_url 与 csv_url。下载端点 /assistant/api/task-examples/artifact 仅放行白名单文件并按 run_id 与 Session 校验。固定 Run 的 U-ASSET-PAGES-001 交付 device_count=5，报告 679 字节，摘要与工具回执一致。"
    source_refs:
