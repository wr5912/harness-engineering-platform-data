    change: "新增"
  - id: "incomplete-boundary"
    title: "漏页不得声称完整交付"
    description: "角色指令与工具校验共同约束：读取未完整时不得声称完整交付或提供完整报告。实测只读第一页时，回答明确五台共三页、还缺 3 台，未调用 report、未给出报告或下载链接，并说明需从 cursor=2 继续。该边界由 U-ASSET-PARTIAL-001 验证通过。"
