  - id: "readonly-scope"
    title: "只读任务与模拟数据边界"
    description: "本版只注册 task_inspection 一个业务工具，并在 agent/pre-step 对目标 Preset 限制 allow 列表；其它工具调用被拦截并返回“任务只允许已绑定业务工具”，Run 中业务会话的 read/glob 均被拒绝。数据来自基础 Mock 台账，未连接或探测真实设备，回答须明确“不是真实设备健康检测”，也不执行设备配置变更。"
