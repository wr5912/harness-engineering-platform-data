  - id: "verification-status"
    title: "评测状态与未验证边界"
    description: "固定 4 个 Case（3 个 fast、1 个 full）在 run-05973a80-6b91-40e7-a0da-acca3a4ea696 中 4/4 通过，有效结论为 passed、封存来源核对 matched；review_status 为 not_requested，证据复核未请求，机器结论为同路由自评、仅作研究辅助。观察记录另有一次正式平台复验（2026-10-16，实例 hep-inspection-delivery:3114）：新 Session 读取三页并交付五台，独立下载 Markdown 699 字节、CSV 362 字节，与同 Session 工具回执逐字节一致。尚未验证：真实设备健康检测、真实业务上游接入、干净版本间因果比较，也不证明任意新智能体可自动交付。"
