    title: "平台 Preset 装配与容器装载"
    description: "通过 managed patch 注册默认 Preset inspection-delivery-demo，引用 agent.cordis.yml（persona 与 agent-instructions 从工作区加载 AGENTS.md，maxBytes 65536），并挂载 task-example-tools，kind=inspection、presetId=inspection-delivery-demo、assetUrl 指向基础 Mock 台账；harness.yaml 标记 container-only、workspace/presets/managed 容器路径与 DEEPSEEK_API_KEY 依赖。固定 Run 封存来源核对为 matched，load_observation 显示 session_preset 与 workspace 均匹配；当前实例 hep-inspection-delivery（端口 3114）观察为 running，但实例可观察不等于业务效果通过。"
