    change: "新增"
  - id: "fixed-asset-scope"
    title: "固定五台资产范围与快照校验"
    description: "start 从基础 Mock 台账接口 http://127.0.0.1:53001/api/v1/assets 读取快照，仅保留 asset-0001 至 asset-0005，并要求恰好 5 台且 asset_id 唯一，否则报“固定基础资产范围不完整，不能生成全量报告”；快照同时记录 source_sha256。实际 Run 的 start 回执为 total=5、source_kind=basic_mock。"
    source_refs:
      - "evolution/experiments/EXP-inspection-delivery-demo-001-rf841e4415364/candidate/dsh/managed/task-example-tools.mjs"
      - "evolution/experiments/EXP-inspection-delivery-demo-001-rf841e4415364/candidate/dsh/workspace/AGENTS.md"
    evidence_refs:
