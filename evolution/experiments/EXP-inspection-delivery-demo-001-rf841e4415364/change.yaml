      - "evolution/experiments/EXP-inspection-delivery-demo-001-rf841e4415364/runs/run-05973a80-6b91-40e7-a0da-acca3a4ea696/evidence/U-ASSET-PARTIAL-001/tools.jsonl"
    change: "新增"
  - id: "paged-read"
    title: "按 cursor 分页读取（每页 2 条，读至 null）"
    description: "page 以 cursor 定位，每次返回 2 条并把已读 asset_id 累积进同一 run 状态；cursor 必须为不小于 0 的偶数且小于总数，回执给出 next_cursor（末尾为 null）。实测完整路径 cursor 0→2→4→null 覆盖三页五台；只读第一页时 next_cursor=2、缺 asset-0003 至 asset-0005。run_id 与 Session 绑定，换 Session 读取会被拒绝。"
    source_refs:
      - "evolution/experiments/EXP-inspection-delivery-demo-001-rf841e4415364/candidate/dsh/managed/task-example-tools.mjs"
      - "evolution/experiments/EXP-inspection-delivery-demo-001-rf841e4415364/candidate/dsh/workspace/AGENTS.md"
