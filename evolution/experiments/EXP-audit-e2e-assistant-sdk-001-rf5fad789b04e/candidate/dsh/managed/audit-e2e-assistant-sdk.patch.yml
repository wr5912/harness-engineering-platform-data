# 注册本 Experiment 的受控 Preset。
- id: agent-preset-registry
  config:
    default: audit-e2e-assistant-sdk

- insert:
    - id: preset-audit-e2e-assistant-sdk
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: audit-e2e-assistant-sdk
        plugins:
          - id: audit-e2e-assistant-sdk-harness
            name: cordis:include
            config:
              path: /opt/dsh-presets/audit-e2e-assistant-sdk/agent.cordis.yml
