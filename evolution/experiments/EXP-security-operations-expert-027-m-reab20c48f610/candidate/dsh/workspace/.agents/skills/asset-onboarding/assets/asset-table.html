<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 8px; font: 13.5px/1.5 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; background: light-dark(#ffffff, #111417); color: light-dark(#1f2328, #e6e8eb); overflow-x: hidden; }
  .card { border: 1px solid light-dark(#e6e8eb, #2a2f35); border-radius: 12px; background: light-dark(#ffffff, #171a1e); overflow: hidden; }
  .head { padding: 12px 14px 4px; }
  .stats { font-size: 13.5px; color: light-dark(#5b6570, #a8b3bd); }
  .stats b { color: light-dark(#1f2328, #e6e8eb); font-weight: 600; }
  .source { margin-top: 2px; font-size: 12px; color: light-dark(#6b7280, #a8b3bd); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .table-wrap { overflow-x: auto; overflow-y: auto; max-height: 420px; scrollbar-gutter: stable; }
  table { width: 100%; min-width: 628px; table-layout: fixed; border-collapse: separate; border-spacing: 0; }
  th { position: sticky; top: 0; z-index: 1; background: light-dark(#f6f8fa, #1d2228); color: light-dark(#5b6570, #a8b3bd); font-weight: 600; font-size: 12.5px; text-align: left; padding: 7px 6px; border-bottom: 1px solid light-dark(#e6e8eb, #2a2f35); white-space: nowrap; }
  td { padding: 6px; border-bottom: 1px solid light-dark(#eef1f4, #23282e); vertical-align: middle; height: 48px; overflow: hidden; }
  tr:last-child td { border-bottom: none; }
  .col-idx { width: 28px; }
  .col-ip { width: 124px; }
  .col-name { width: 122px; }
  .col-type { width: 72px; }
  .col-os { width: 86px; }
  .col-deploy { width: 116px; }
  .col-status { width: 80px; }
  .col-name input, .col-os input { text-overflow: ellipsis; }
  .idx { color: light-dark(#6b7280, #a8b3bd); font-variant-numeric: tabular-nums; }
  .ip { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; white-space: nowrap; }
  input { width: 100%; min-width: 0; height: 32px; padding: 0 8px; font: inherit; font-size: 13px; color: inherit; background: light-dark(#ffffff, #111417); border: 1px solid light-dark(#d0d7de, #343b43); border-radius: 8px; outline: none; }
  input:focus { border-color: #3b82f6; box-shadow: 0 0 0 3px light-dark(rgba(59,130,246,.14), rgba(59,130,246,.24)); }
  .deploy-field { position: relative; }
  .deploy-field input { padding-right: 24px; }
  .deploy-field::after { content: ""; position: absolute; right: 9px; top: 50%; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-top: 5px solid currentColor; transform: translateY(-50%); opacity: .55; pointer-events: none; }
  .pill { display: inline-flex; align-items: center; gap: 6px; padding: 2px 9px; border-radius: 999px; font-size: 12.5px; line-height: 1.6; white-space: nowrap; }
  .pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .p-green { background: light-dark(#e8f5ec, #12301c); color: light-dark(#1a7f37, #4ade80); }
  .p-yellow { background: light-dark(#fff6e0, #33270a); color: light-dark(#9a6700, #facc15); }
  .p-blue { background: light-dark(#e8f1fe, #0f2438); color: light-dark(#1d4ed8, #60a5fa); }
  .p-red { background: light-dark(#fdecec, #351414); color: light-dark(#b42318, #f87171); }
  .p-gray { background: light-dark(#f1f3f5, #23282e); color: light-dark(#5b6570, #a8b3bd); }
  .foot { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
  .hint { flex: 1; font-size: 12.5px; color: light-dark(#6b7280, #a8b3bd); }
  button { min-width: 96px; height: 36px; padding: 0 16px; font: inherit; font-weight: 600; font-size: 13px; color: #ffffff; background: #1a7f37; border: 1px solid #1a7f37; border-radius: 8px; cursor: pointer; white-space: nowrap; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.secondary { background: transparent; color: light-dark(#1f2328, #e6e8eb); border-color: light-dark(#d0d7de, #343b43); font-weight: 500; }
  button.secondary:disabled { opacity: .45; }
  .notice { padding: 0 14px 8px; font-size: 12.5px; color: light-dark(#9a6700, #facc15); }
  details { padding: 0 14px 12px; font-size: 12.5px; color: light-dark(#6b7280, #a8b3bd); }
  summary { cursor: pointer; user-select: none; padding: 6px 0; }
  .kv { display: grid; grid-template-columns: max-content 1fr; gap: 4px 12px; margin-top: 4px; }
  .kv span:nth-child(odd) { color: light-dark(#6b7280, #a8b3bd); }
  @media (max-width: 680px) { th, td { padding: 6px; } .foot { flex-wrap: wrap; } }
</style>
</head>
<body>
<div class="card">
  <div class="head">
    <div class="stats" id="stats"></div>
    <div class="source" id="source"></div>
  </div>
  <div class="table-wrap">
    <table>
      <colgroup>
        <col class="col-idx" /><col class="col-ip" /><col class="col-name" /><col class="col-type" /><col class="col-os" /><col class="col-deploy" /><col class="col-status" />
      </colgroup>
      <thead><tr id="head"></tr></thead>
      <tbody id="body"></tbody>
    </table>
  </div>
  <div class="notice" id="notice" hidden></div>
  <div class="foot">
    <span class="hint" id="hint"></span>
    <button class="secondary" id="cancel" type="button">取消纳管</button>
    <button id="confirm" type="button" disabled>确认纳管</button>
  </div>
  <details>
    <summary>来源与统计详情</summary>
    <div class="kv" id="detail"></div>
  </details>
</div>
<datalist id="deploy-options">
  <option value="物理设备"></option>
  <option value="虚拟机"></option>
  <option value="容器"></option>
</datalist>
<script>
(() => {
  const data = window.__ASSET_PREVIEW__ || (window.dsh && window.dsh.data) || {};
  const columns = data.table?.columns || ['序号', 'IP', '名称', '设备类型', '操作系统', '部署形态', '状态'];
  const rows = data.table?.rows || [];
  const summary = data.summary || {};
  const emit = (name, payload) => {
    if (window.dsh && typeof window.dsh.emit === 'function') return window.dsh.emit(name, payload);
    if (window.parent && window.parent !== window) { window.parent.postMessage({ type: name, payload }, '*'); return; }
    throw new Error('bridge unavailable');
  };
  const TYPE_LABEL = { host: '主机', server: '服务器', switch: '交换机', router: '路由器', firewall: '防火墙' };
  const TYPE_VALUE = Object.fromEntries(Object.entries(TYPE_LABEL).map(([key, label]) => [label, key]));
  // 兼容裸code（host）与展示形式（host（主机））；未知或自定义值原样保留，不误归类。
  const typeCode = (value) => {
    const text = String(value ?? '').trim();
    const matched = /^([A-Za-z][\w-]*)（[^）]+）$/u.exec(text);
    return matched ? matched[1] : text;
  };
  const typeDisplay = (value) => {
    const text = String(value ?? '').trim();
    const code = typeCode(text);
    if (TYPE_LABEL[code]) return TYPE_LABEL[code];
    return text === '未知' ? '' : text;
  };
  const typeEmit = (value) => {
    const text = String(value ?? '').trim();
    if (!text) return '';
    const byLabel = Object.entries(TYPE_LABEL).find(([, label]) => label === text);
    if (byLabel) return byLabel[0];
    const code = typeCode(text);
    return TYPE_LABEL[code] ? code : text;
  };
  const DEPLOY_LABEL = { physical: '物理设备', vm: '虚拟机', container: '容器' };
  const DEPLOY_VALUE = { '物理设备': 'physical', '虚拟机': 'vm', '容器': 'container' };
  const STATUS_CLASS = { '可提交': 'p-green', '待补全': 'p-yellow', '校验中': 'p-blue', '提交失败': 'p-red', '待核对': 'p-gray', '已跳过': 'p-gray', '已提交': 'p-green' };
  const pending = Number(summary.pending ?? rows.length);
  const incomplete = rows.filter(row => row[6] === '待补全').length;
  const ready = rows.filter(row => row[6] === '可提交').length;
  const conflicts = Number(summary.conflicts ?? 0);
  const baselineUnknown = Number(summary.baseline_unknown ?? 0);
  document.getElementById('stats').innerHTML = `共 <b>${pending}</b> 台 · 待补全 <b>${incomplete}</b> · 可提交 <b>${ready}</b>`;
  const kind = summary.source?.kind;
  const shortSource = kind === 'excel' ? '附件导入' : kind === 'discovery' ? '网络发现' : '未知来源';
  document.getElementById('source').textContent = data.source_file || shortSource;
  const head = document.getElementById('head');
  for (const name of columns) { const th = document.createElement('th'); th.textContent = name; head.appendChild(th); }
  const body = document.getElementById('body');
  let dirty = 0;
  rows.forEach((cells, index) => {
    const tr = document.createElement('tr');
    cells.forEach((value, col) => {
      const td = document.createElement('td');
      const name = columns[col];
      const label = `第${index + 1}行 ${name}`;
      if (name === '序号') { td.className = 'idx'; td.textContent = value; }
      else if (name === 'IP') { td.className = 'ip'; td.textContent = value; }
      else if (name === '状态') {
        const pill = document.createElement('span');
        pill.className = `pill ${STATUS_CLASS[value] || 'p-gray'}`;
        pill.textContent = value;
        td.appendChild(pill);
      } else if (name === '设备类型') {
        const input = document.createElement('input');
        input.setAttribute('aria-label', label);
        input.value = typeDisplay(value);
        input.placeholder = '';
        input.addEventListener('change', () => {
          dirty++;
          emit('asset-table:edit', { row_index: index + 1, ip: cells[1], field: 'assetType', value: typeEmit(input.value) });
        });
        td.appendChild(input);
      } else if (name === '部署形态') {
        const input = document.createElement('input');
        input.setAttribute('aria-label', label);
        input.setAttribute('list', 'deploy-options');
        input.value = DEPLOY_LABEL[value] || value || '';
        input.placeholder = '请选择';
        const field = document.createElement('div');
        field.className = 'deploy-field';
        input.addEventListener('change', () => {
          dirty++;
          const text = input.value.trim();
          emit('asset-table:edit', { row_index: index + 1, ip: cells[1], field: 'deployForm', value: DEPLOY_VALUE[text] || text });
        });
        field.appendChild(input);
        td.appendChild(field);
      } else if (name === '名称' || name === '操作系统') {
        const input = document.createElement('input');
        input.setAttribute('aria-label', label);
        input.value = value === '未知' || value === '未识别' ? '' : value;
        input.placeholder = name === '操作系统' ? '未识别' : '';
        input.addEventListener('change', () => {
          dirty++;
          emit('asset-table:edit', { row_index: index + 1, ip: cells[1], field: name === '名称' ? 'hostname' : 'os', value: input.value.trim() });
        });
        td.appendChild(input);
      } else td.textContent = value;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
  const confirm = document.getElementById('confirm');
  const hint = document.getElementById('hint');
  const notice = document.getElementById('notice');
  const blocked = conflicts > 0;
  const baselineBlocked = !blocked && baselineUnknown > 0;
  confirm.disabled = pending === 0 || blocked || baselineBlocked || incomplete > 0;
  if (blocked) {
    notice.hidden = false;
    notice.textContent = '存在同 IP 冲突，整批已阻断，请先核对。';
  } else if (baselineBlocked) {
    notice.hidden = false;
    notice.textContent = '暂时无法核对SOC已有资产，请稍后重试';
  } else {
    notice.hidden = true;
    if (incomplete > 0) hint.textContent = '补齐部署形态后可提交。';
    else if (pending === 0) hint.textContent = '没有待纳管设备。';
    else hint.textContent = '确认后提交本次清单。';
  }
  const detail = document.getElementById('detail');
  const pairs = [
    ['来源', shortSource],
    ['批次', String(data.preview_digest || '').slice(0, 12)],
    ['候选总数', String(summary.candidates ?? '-')],
    ['已纳管', String(summary.already_managed ?? '-')],
    ['冲突', String(conflicts)],
    ['未响应', String(summary.unreachable ?? '-')],
    ['SOC 基线读失败', String(baselineUnknown)],
  ];
  for (const [key, value] of pairs) {
    const k = document.createElement('span'); k.textContent = key;
    const v = document.createElement('span'); v.textContent = value;
    detail.append(k, v);
  }
  const cancel = document.getElementById('cancel');
  cancel.addEventListener('click', () => {
    try {
      const pending = emit('asset-table:cancel', { preview_digest: data.preview_digest });
      if (pending && typeof pending.catch === 'function') pending.catch(() => { hint.textContent = '取消请求未送达，请稍后重试'; });
    } catch {
      hint.textContent = '取消请求未送达，请稍后重试';
      return;
    }
    document.querySelectorAll('input').forEach(input => { input.disabled = true; });
    confirm.disabled = true;
    cancel.disabled = true;
    notice.hidden = true;
    hint.textContent = '正在取消…请等待服务端确认';
  });
  confirm.addEventListener('click', () => emit('asset-table:confirm', { preview_digest: data.preview_digest, dirty }));
})();
</script>
</body>
</html>
