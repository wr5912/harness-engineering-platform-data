# dsh-decision-engine 的 bundle 层。
#
# 这里**刻意不写 config**。
#
# 原因：bundle patch 属于 profile 配置层，而 DSH 传给插件 apply() 的 config
# 是 Schemastery 解析后的完整默认值（enabled:false / mode:shadow ...），
# 并非用户显式配置。若在此硬编码，会盖掉用户在配置页保存的选择，
# 表现为「一按保存就自动弹回关闭」。
#
# 运行时配置的唯一来源是插件目录下的 config.yml（配置页保存的也是它）。
# 插件内的 DEFAULTS 只负责兜底，不在此重复声明。
- insert:
    - id: decision-engine
      name: dsh-decision-engine
