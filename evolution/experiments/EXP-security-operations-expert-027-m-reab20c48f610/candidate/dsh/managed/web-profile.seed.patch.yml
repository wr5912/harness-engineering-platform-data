# 新实例的初始连接；地址、鉴权及资源范围在 MCP 配置管理中保存。
- insert:
  - id: mcp-session-manager
    name: file:///opt/dsh-managed/mcp-manager/index.mjs
    config:
      servers:
      - id: policy-response
        serverName: policy-response
        description: 策略与应急原始 AISOC 工具和资源
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/policy-response/v2
        headers: []
        tools:
          mode: all
          names: []
      - id: policy-response-acceptance
        serverName: policy-response-acceptance
        description: 策略与应急未发布组合专用验收入口，待平台绑定
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/policy-response-acceptance/v2
        headers: []
        tools:
          mode: selected
          names:
          - policy_change
          - emergency_action
      - id: xx-device-acceptance
        serverName: xx-device-acceptance
        description: XX指令与三Map模板的专属Mock组合验收
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/xx-device-acceptance/v2
        headers: []
        tools:
          mode: all
          names: []
      - id: soc-readonly
        serverName: soc-readonly
        description: 只读资产与来源核验；路由层用它取 source/sourceRef
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/soc-readonly/v2
        headers: []
        tools:
          mode: all
          names: []
      - id: ai-soc-correlate
        serverName: ai-soc-correlate
        description: SOC 关联/研判读取（应急处置资源）
        enabled: true
        specUrl: http://172.16.138.223:18085/v3/api-docs/mcp
        apiKey: ''
        authType: credential
        authHeader: X-API-Key
        headers: []
        tools:
          mode: all
          names: []
      - id: ai-soc-master
        serverName: ai-soc-master
        description: SOC Master 资产发现与纳管动作（asset-management组唯一来源）
        enabled: true
        specUrl: http://172.16.138.232:18087/v3/api-docs/mcp
        apiKey: ''
        authType: credential
        authHeader: X-API-Key
        headers: []
        tools:
          mode: all
          names: []
      - id: inspection-compositions
        serverName: inspection-compositions
        description: ''
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/inspection-compositions/v2
        headers: []
        tools:
          mode: all
          names: []
      - id: troubleshooting-compositions
        serverName: troubleshooting-compositions
        description: 只读业务访问与设备不在线排查及同次运行报告
        enabled: true
        url: http://172.16.138.228:18120/hep/mcp/groups/troubleshooting-compositions/v2
        headers: []
        tools:
          mode: selected
          names:
          - diagnose_business_access
          - diagnose_device_offline
          - get_composition_run
          - get_composition_artifact
          - get_composition_details
      - id: report-write
        serverName: report-write
        description: 仅受信研判运行时保存并回读同次报告，不向模型授权写入
        enabled: true
        url: http://172.16.138.228:26000/mcp/persistence
        headers: []
        tools:
          mode: selected
          names:
          - save_persistence_result
          - get_persistence_result
      - id: threat-analysis-runtime
        serverName: threat-analysis-runtime
        description: 平台工具与资源分组 v2；服务就绪后在 MCP 管理页发现并启用。
        enabled: false
        url: http://10.0.160.32:18120/hep/mcp/groups/threat-analysis-runtime/v2
        headers: []
        tools:
          mode: selected
          names: []
      groups:
      # 纳管底层来源仅供高层入口核对。
      - id: asset-management
        members:
        - serverId: ai-soc-master
          names:
          - create_soc_asset_probe
          - create_soc_discovery_identify
          - create_soc_discovery_tasks
          - start_soc_discovery_tasks
          - create_soc_discovery_tasks_adopt
          - create_soc_asset
          resourceUris: []
          resourceTemplates:
          - http://172.16.138.232:18087/soc/discovery/tasks/{taskId}
          - http://172.16.138.232:18087/soc/discovery/tasks/{taskId}/scope
          - http://172.16.138.232:18087/soc/asset/{assetId}
          - http://172.16.138.232:18087/soc/asset/list{?pageNum,pageSize,ip,hostname,keyword,source,layerId,excludeLayerId,online,assetType,vendor,status,techStatus,deptId,sortField,sortOrder,collectionStatus,collectAnomaly,modelIds,includeUnits,assetView,rootOnly,hostAssetId,bizIds,bizAssociation}
      sharedToken: ''
