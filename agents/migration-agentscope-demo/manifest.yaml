description: 迁移自固定 AgentScope 样例 agentscope 的版本顾问：必须调用 select_newer_version 比较用户提供的两个版本，缺少版本先补问，输入无效时说明工具错误、不猜测。version_tool.py 保留为独立 Python 函数（真实依赖 packaging==25.0），经 TypeScript 原生工具的 JSON 子进程桥接实际调用 Python3；AgentScope 运行时由 DSH 原生 Agent 工具循环替代，不装入 agentscope 框架。来源未执行原框架，不代表全量等效。
